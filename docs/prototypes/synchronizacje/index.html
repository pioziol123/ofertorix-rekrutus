<style>

.backdrop{position:fixed;inset:0;background:rgba(20,30,25,.25);z-index:5}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:#fff;z-index:6;padding:22px;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.12)}

dialog{border:0;border-radius:14px;padding:22px;width:min(620px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}

<script>
// ---------- data ----------
const SOURCES=[
  {id:'solidjobs',name:'SOLID.Jobs',group:'fixed',enabled:true,scheduled:true,absence:true},
  {id:'himalayas',name:'Himalayas',group:'fixed',enabled:true},
  {id:'indeed',name:'Indeed',group:'jobspy',enabled:true},
  {id:'linkedin',name:'LinkedIn',group:'jobspy',enabled:true},
  {id:'bayt',name:'Bayt',group:'jobspy',enabled:true},
  {id:'glassdoor',name:'Glassdoor',group:'jobspy',enabled:true},

  {id:'google',name:'Google Jobs',group:'jobspy',enabled:false,reason:'Niepodłączone'},
  {id:'bulldogjob',name:'Bulldogjob',group:'polish',enabled:true,scoped:true},
  {id:'theprotocol',name:'theprotocol.it',group:'polish',enabled:true,scoped:true},
  {id:'justjoinit',name:'Just Join IT',group:'polish',enabled:true,scoped:true},
  {id:'nofluffjobs',name:'No Fluff Jobs',group:'polish',enabled:true,scoped:true},
];
const GROUPS={fixed:'Inne źródła',jobspy:'Portale JobSpy',polish:'Polskie serwisy'};
const STATUS={queued:'W kolejce',running:'W toku',complete:'Pełna',partial:'Niepełna',failed:'Nieudana'};
const MEANING={
  queued:'Zlecona, czeka na wolne miejsce do pobierania.',
  running:'Pobieranie trwa. Liczby rosną w miarę zapisywania kolejnych porcji ogłoszeń.',
  complete:'Sprawdzono cały ustawiony zakres źródła. Pełna synchronizacja nie znaczy, że pobrano cały portal — tylko cały zakres.',
  partial:'Pobrano tylko część zakresu. Pobrane ogłoszenia są zapisane; brak pozostałych nie oznacza, że są niedostępne.',
  failed:'Nie udało się pobrać żadnego ogłoszenia. Dostępność ogłoszeń tego źródła się nie zmieniła.'};
const SENIORITY=['','junior','mid','senior','expert','lead'];
const src=id=>SOURCES.find(s=>s.id===id);
const H=3600e3, D=24*H, NOW0=Date.now();
const at=(daysAgo,h,m)=>{const d=new Date(NOW0-daysAgo*D);d.setHours(h,m,0,0);return d.getTime()};
let seq=100;
function mk(o){const r={id:'r'+(seq++),trigger:'manual',scope:null,pages:0,found:0,fresh:0,updated:0,gone:null,attempt:1,error:null,tech:null,...o};
  if(!r.started&&r.status!=='queued')r.started=r.created+20e3;
  if(['complete','partial','failed'].includes(r.status)&&!r.finished)r.finished=r.started+(r.dur||180e3);
  if(src(r.source).absence&&r.status==='complete'&&r.gone===null&&!r.legacy)r.gone=0; return r}
const PHP_S={technology:'PHP',seniority:'senior'};
let runs=[
  mk({source:'solidjobs',status:'complete',trigger:'scheduled',created:at(0,8,0),dur:260e3,pages:12,found:214,fresh:9,updated:14,gone:3}),
  mk({source:'justjoinit',status:'partial',created:at(0,9,12),dur:150e3,pages:5,found:50,fresh:7,updated:2,scope:PHP_S,error:'Osiągnięto limit 50 ogłoszeń na jedną synchronizację, zanim sprawdzono cały zakres.',tech:{limit:'maxOffers',offers:50,pages:5,requests:22}}),
  mk({source:'linkedin',status:'partial',created:at(0,9,30),dur:410e3,pages:3,found:38,fresh:11,updated:0,error:'Portal zaczął odrzucać zapytania po 3 stronach. Zachowano 38 ogłoszeń.',tech:{http:429,message:'Too Many Requests',retryAfter:'3600s'}}),
  mk({source:'bayt',status:'failed',created:at(1,16,40),dur:62e3,error:'Nie udało się połączyć z portalem w żadnej z 3 prób.',attempt:3,tech:{code:'ETIMEDOUT',attempts:3}}),
  mk({source:'indeed',status:'complete',created:at(1,16,35),dur:330e3,pages:6,found:93,fresh:21,updated:5}),
  mk({source:'nofluffjobs',status:'complete',created:at(1,11,5),dur:120e3,pages:3,found:31,fresh:4,updated:1,scope:PHP_S}),
  mk({source:'solidjobs',status:'complete',trigger:'scheduled',created:at(1,8,0),dur:244e3,pages:12,found:221,fresh:5,updated:8,gone:0}),
  mk({source:'himalayas',status:'complete',created:at(2,19,2),dur:95e3,pages:4,found:77,fresh:0,updated:3}),
  mk({source:'bulldogjob',status:'complete',created:at(2,18,50),dur:80e3,pages:2,found:18,fresh:2,updated:0,scope:PHP_S}),
  mk({source:'theprotocol',status:'failed',created:at(2,18,49),dur:3*3600e3,attempt:3,error:'Synchronizacja została przerwana we wszystkich 3 próbach (np. zatrzymanie aplikacji). Zlecono nową, jeśli chcesz ponowić.',tech:{message:'Worker interrupted; request a new import'},scope:PHP_S}),
  mk({source:'solidjobs',status:'partial',trigger:'scheduled',created:at(2,8,0),dur:600e3,pages:7,found:130,fresh:2,updated:6,error:'Źródło przestało odpowiadać po 7 stronach. Dostępność pozostałych ogłoszeń bez zmian.',tech:{http:503}}),
  mk({source:'glassdoor',status:'complete',created:at(4,10,10),dur:200e3,pages:5,found:64,fresh:12,updated:2}),
  mk({source:'solidjobs',status:'complete',trigger:'scheduled',created:at(4,8,0),dur:250e3,pages:12,found:219,fresh:7,updated:10,gone:5}),
  mk({source:'indeed',status:'complete',created:at(9,14,0),dur:300e3,pages:6,found:88,fresh:30,updated:0}),
];
// Older history, so "Cała historia" spans many pages (the page jump needs them).
for(let d=10;d<130;d++){runs.push(mk({source:'solidjobs',status:d%9?'complete':'partial',trigger:'scheduled',created:at(d,8,0),pages:12,found:200+d%30,fresh:d%11,updated:d%7,legacy:true,error:d%9?null:'Źródło przestało odpowiadać przed końcem zakresu.'}));
  if(d%3===0){const id=['indeed','himalayas','glassdoor','nofluffjobs'][d%4];runs.push(mk({source:id,status:'complete',created:at(d,15,30),pages:4,found:40+d%20,fresh:d%13,updated:d%5,scope:src(id).scoped?PHP_S:null}))}}
// ---------- state ----------
const params=new URLSearchParams(location.search);
let variant=['A','C'].includes(params.get('variant'))?params.get('variant'):'C';
let selected=params.get('sync')||null;
let F={source:[],status:[],trigger:'',period:'7'};
// Pages of the history, as on the offer list; 10 per page so the mock-up's data spans several pages.
const PAGE=10;let page=1,pageCount=1,pagerOpen=false;
// "Strona N z X" looks like a select and opens a list of every page number. There is no
// visible field: digits typed while the list is open narrow it to the numbers that start
// with them, Backspace removes the last digit (the list goes back to its previous state),
// Enter picks the first number shown, Escape or a click outside closes it.
let pageTyped='';
function drawPageJump(){const list=document.querySelector('.pjump-list'),hint=document.querySelector('.pjump-hint');if(!list)return;
  const n=[...Array(pageCount)].map((_,i)=>String(i+1)).filter(x=>x.startsWith(pageTyped));
  hint.textContent=pageTyped;hint.hidden=!pageTyped;
  list.innerHTML=n.length?n.map(x=>`<button data-goto="${x}" class="${Number(x)===page?'cur':''}">Strona ${x}</button>`).join(''):'<span class="muted">Brak takiej strony</span>'}
function openPageJump(){pagerOpen=true;pageTyped='';const box=document.querySelector('.pjump');box.querySelector('[data-pjump]').setAttribute('aria-expanded','true');
  // An invisible field takes the keyboard while the list is open, wherever the focus was before.
  box.insertAdjacentHTML('beforeend',`<div class="pjump-pop"><input class="pjump-keys" inputmode="numeric" autocomplete="off" aria-label="Numer strony"><div class="pjump-hint" hidden></div><div class="pjump-list"></div></div>`);
  const keys=box.querySelector('.pjump-keys');
  keys.oninput=()=>{keys.value=keys.value.replace(/\D/g,'');pageTyped=keys.value;drawPageJump()};
  keys.onkeydown=e=>{if(e.key==='Enter'){const f=document.querySelector('.pjump-list [data-goto]');if(f)f.click();e.preventDefault()}else if(e.key==='Escape'){closePageJump();e.stopPropagation()}};
  drawPageJump();keys.focus({preventScroll:true})}
function closePageJump(){pagerOpen=false;refresh()}
let scope={technology:'PHP',seniority:'senior'};
let message='', justAdded=null;
const NAMES={A:'Tabela + panel szczegółów',C:'Oś czasu + szuflada (wybrany)'};

// ---------- helpers ----------
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=t=>new Date(t).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
function dayLabel(t){const d=new Date(t),n=new Date();const a=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();const diff=Math.floor((a-new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime())/D);
  return diff===0?'dziś':diff===1?'wczoraj':d.toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}
const when=t=>`${dayLabel(t)} ${hm(t)}`;
function dur(ms){if(ms<60e3)return Math.max(1,Math.round(ms/1e3))+' s';if(ms<H)return Math.round(ms/60e3)+' min';return (ms/H).toFixed(1).replace('.',',')+' h'}
const scopeLabel=s=>s?`${s.technology||'wszystkie technologie'} · ${s.seniority||'wszystkie poziomy'}`:'';
const unfinished=id=>runs.find(r=>r.source===id&&['queued','running'].includes(r.status));
const latest=id=>runs.filter(r=>r.source===id).sort((a,b)=>b.created-a.created)[0];
const latestComplete=id=>runs.filter(r=>r.source===id&&r.status==='complete').sort((a,b)=>b.finished-a.finished)[0];
// Icons (Lucide-style strokes): state in the badge, trigger next to the source name.
const ic=(d,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const STATE_IC={
  queued:ic('<path d="M6 2h12M6 22h12M7 2c0 5 10 5 10 10S7 17 7 22M17 2c0 5-10 5-10 10s10 5 10 10"/>'),
  running:ic('<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'),
  complete:ic('<path d="M20 6 9 17l-5-5"/>'),
  partial:ic('<circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>'),
  failed:ic('<path d="M18 6 6 18M6 6l12 12"/>')};
const TRIG_IC={
  manual:ic('<path d="M9 9V4.5a1.5 1.5 0 0 1 3 0V9"/><path d="M12 8.5V3.5a1.5 1.5 0 0 1 3 0V10"/><path d="M15 9.5V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L3 14.5a1.6 1.6 0 0 1 2.6-1.8L9 15V9"/>'),
  scheduled:ic('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="12" cy="15.5" r="2.6"/><path d="M12 14.4v1.2l.8.6"/>')};
const trig=t=>`<span class="trig" data-tip="${t==='scheduled'?'Uruchomiona z harmonogramu dziennego':'Uruchomiona ręcznie'}" tabindex="0">${TRIG_IC[t]}</span>`;
const badge=s=>`<span class="badge s-${s}" data-tip="${MEANING[s]}" tabindex="0">${STATE_IC[s]}${STATUS[s]}</span>`;
const plural=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?b:c;
function result(r){
  if(r.status==='queued')return `<span class="muted">Czeka na start</span>`;
  if(r.status==='running')return `<span class="muted">Znaleziono ${r.found} · trwa…</span>`;
  // A failed sync shows the same groups, all zero; the reason is in the details.
  const p=(n,cls,a,b,c)=>`<span class="${n?cls:'zero'}">${n?'+':''}${n} ${plural(n,a,b,c)}</span>`;
  const gone=src(r.source).absence&&!r.legacy?(r.gone??0):r.legacy&&src(r.source).absence?null:undefined;
  return `<div class="res">${p(r.fresh,'n-new','nowe','nowe','nowych')}${p(r.updated,'n-upd','zmienione','zmienione','zmienionych')}${gone===null?`<span class="zero" title="Liczone od wdrożenia panelu">— niedostępne</span>`:''}${gone!=null?`<span class="${gone?'n-gone':'zero'}">${gone} ${plural(gone,'niedostępne','niedostępne','niedostępnych')}</span>`:''}</div>`}
function filtered(){const cut=F.period==='all'?0:F.period==='today'?new Date(new Date().setHours(0,0,0,0)).getTime():Date.now()-Number(F.period)*D;
  return runs.filter(r=>(!F.source.length||F.source.includes(r.source))&&(!F.trigger||r.trigger===F.trigger)&&r.created>=cut&&
    (!F.status.length||F.status.includes(r.status)))
    .sort((a,b)=>b.created-a.created)}
const count=fn=>runs.filter(fn).length;
const attention7=()=>count(r=>['partial','failed'].includes(r.status)&&r.created>Date.now()-7*D);
const active=()=>count(r=>['queued','running'].includes(r.status));

// ---------- actions ----------
function request(id,sc){const s=src(id);
  const ex=unfinished(id); if(ex)return {run:ex,existing:true};
  const plan=id==='linkedin'?'partial':id==='bayt'&&Math.random()<.5?'failed':'complete';
  const r=mk({source:id,status:'queued',created:Date.now(),scope:s.scoped?{...sc}:null,plan,planDur:5e3+Math.random()*6e3});
  runs.push(r); justAdded=r.id; setTimeout(()=>{if(justAdded===r.id)justAdded=null},1500); return {run:r,existing:false}}
function requestOne(id){const {run,existing}=request(id,scope);
  message=existing?`Synchronizacja ${src(id).name} już trwa — nie zlecono drugiej. Pokazujemy trwającą.`:`Zlecono synchronizację ${src(id).name}.`;
  select(run.id)}
function tick(){let changed=false;const now=Date.now();
  for(const r of runs){
    if(r.status==='queued'&&now-r.created>2000){r.status='running';r.started=now;changed=true}
    else if(r.status==='running'&&r.plan){changed=true;
      if(r.plan!=='failed'){r.pages++;const add=3+Math.floor(Math.random()*7);r.found+=add;r.fresh+=Math.floor(add*Math.random()*.4);r.updated+=Math.random()<.3?1:0}
      if(now-r.started>r.planDur){r.status=r.plan;r.finished=now;
        if(r.plan==='complete'&&src(r.source).absence)r.gone=Math.floor(Math.random()*4);
        if(r.plan==='partial'){r.error='Portal zaczął odrzucać zapytania. Zachowano pobrane ogłoszenia; dostępność pozostałych bez zmian.';r.tech={http:429}}
        if(r.plan==='failed'){r.found=r.fresh=r.updated=r.pages=0;r.attempt=3;r.error='Nie udało się połączyć z portalem w żadnej z 3 prób.';r.tech={code:'ECONNRESET',attempts:3}}}}}
  if(changed)refresh()}
setInterval(tick,1000);
function select(id){selected=id;const u=new URL(location);id?u.searchParams.set('sync',id):u.searchParams.delete('sync');history.replaceState({},'',u);render()}

// ---------- shared pieces ----------
// Multiselect: choices apply only when the list closes (click outside, Escape or the summary).
function msHTML(key,opts){const sel=F[key];const label=!sel.length?'Wszystkie':sel.length===1?opts.find(o=>o[0]===sel[0])[1]:`Wybrano: ${sel.length}`;

  <label>Źródło${msHTML('source',SOURCES.filter(s=>s.enabled).map(s=>[s.id,s.name]))}</label>

  <label>Uruchomienie<select data-f="trigger">${o('','Wszystkie',F.trigger)}${o('manual','Ręcznie',F.trigger)}${o('scheduled','Z harmonogramu',F.trigger)}</select></label>
  <label>Okres<select data-f="period">${o('today','Dziś',F.period)}${o('7','Ostatnie 7 dni',F.period)}${o('30','Ostatnie 30 dni',F.period)}${o('all','Cała historia',F.period)}</select></label>
  <div class="chips" id="chips"></div></div>`}
function clearHTML(){const def=!F.source.length&&!F.status.length&&!F.trigger&&F.period==='7';return def?'':'<button class="ghost small" data-chip="clear">Wyczyść filtry</button>'}
function scopeHTML(label='Zakres dla polskich serwisów'){return `<div class="scope"><span>${label}:</span><label>Technologia <input data-scope="technology" value="${esc(scope.technology)}" placeholder="puste = wszystkie" size="10"></label><label>Poziom <select data-scope="seniority">${SENIORITY.map(s=>`<option value="${s}" ${scope.seniority===s?'selected':''}>${s||'wszystkie'}</option>`).join('')}</select></label></div>`}
function tableHTML(xs,{showSource=true}={}){if(!xs.length)return `<div class="empty">Brak synchronizacji dla tych filtrów.</div>`;

function detailHTML(r){if(!r)return '';const s=src(r.source);
  const fact=(n,l,na)=>na?`<div class="fact na"><b>nie dotyczy</b><small>${l}</small></div>`:`<div class="fact"><b>${n}</b><small>${l}</small></div>`;
  const done=['complete','partial','failed'].includes(r.status);

    ${s.absence?fact(r.legacy?'—':(r.gone??0),'oznaczonych jako niedostępne w źródle'):fact(0,'niedostępne w źródle — źródło nie pozwala wnioskować z braku ogłoszenia',true)}
  </div>

  <div class="sect"><h3>Przebieg</h3><dl>

    <dt>Koniec</dt><dd>${r.finished?when(r.finished):'—'}</dd>

  <div class="actions">${done?`<button class="primary" data-rerun="${r.id}">Uruchom ponownie</button>`:''}</div>`}
function openAllDialog({title='Synchronizuj wszystkie źródła',preselect='enabled'}={}){

  dlg.innerHTML=`<h2>${title}</h2><p class="muted" style="margin:4px 0 0">Zaznaczone źródła dostaną po jednej synchronizacji. Źródło, które już ma trwającą, nie dostanie drugiej. Źródła działają równolegle.</p>
   <div class="dlg-list">${Object.entries(GROUPS).map(([g,l])=>`<h4>${l}</h4>${SOURCES.filter(s=>s.group===g).map(item).join('')}`).join('')}</div>
   <p class="sub">Każde źródło pobiera ten sam zakres: PHP · senior.</p>

  const upd=()=>{const n=dlg.querySelectorAll('[data-pick]:checked').length;dlg.querySelector('#pickCount').textContent=`Zaznaczono ${n} ${plural(n,'źródło','źródła','źródeł')}`};

    justAdded=null;F.status=['queued','running'];page=1;dlg.close();render()};
  dlg.showModal()}

// ---------- variant A: table + detail panel ----------
function VariantA(){return `
  <div class="heading"><div><p class="eyebrow">SYNCHRONIZACJA OGŁOSZEŃ</p><h1>Synchronizacje</h1><p class="muted" style="margin:4px 0 0">Uruchamianie pobierania ogłoszeń ze źródeł i historia wyników</p></div>

function sourcesA(){return `<div class="groups">${Object.entries(GROUPS).map(([g,l])=>`<div class="group"><h4>${l}</h4><div class="tiles">${SOURCES.filter(s=>s.group===g).map(s=>{const u=unfinished(s.id),c=latestComplete(s.id),L=latest(s.id);

// ---------- variant C: timeline + drawer ----------
function VariantC(){return `
  <div class="heading"><div><p class="eyebrow">SYNCHRONIZACJA OGŁOSZEŃ</p><h1>Synchronizacje</h1></div>

  <section id="list"></section><div id="pager"></div>${selected?'<div class="backdrop" data-close></div><aside class="drawer" id="detail"></aside>':''}`}
function sourcesC(){const enabled=SOURCES.filter(s=>s.enabled);const stale=enabled.filter(s=>{const c=latestComplete(s.id);return !c||Date.now()-c.finished>3*D});

  <span class="muted">Bez pełnej synchronizacji od 3 dni: ${staleNames(stale.map(s=>s.name))}</span>`}
// Up to 3 names; the rest behind "i N innych", which expands the list in place.
let staleOpen=false;
function staleNames(n){if(!n.length)return '—';if(staleOpen||n.length<=3)return n.join(', ')+(n.length>3?' <button class="linkish" data-stale>zwiń</button>':'');
  const k=n.length-3;return `${n.slice(0,3).join(', ')} <button class="linkish" data-stale>i ${k} ${plural(k,'inne','inne','innych')}</button>`}
function timelineC(xs){if(!xs.length)return `<div class="card empty">Brak synchronizacji dla tych filtrów.</div>`;

// ---------- render ----------
function render(){
  document.querySelector('#app').innerHTML={A:VariantA,C:VariantC}[variant]();
  document.querySelector('#vlabel').textContent=`${variant} · ${NAMES[variant]}`;
  bindStatic(); refresh()}
function refresh(){
  const $=s=>document.querySelector(s);
  const srcBox=$('#sources'); if(srcBox&&!(srcBox.contains(document.activeElement)&&document.activeElement.matches('input,select')))srcBox.innerHTML={A:sourcesA,C:sourcesC}[variant]();
  const all=filtered(),pages=Math.max(1,Math.ceil(all.length/PAGE));if(page>pages)page=pages;const shown=all.slice((page-1)*PAGE,page*PAGE);
  $('#list').innerHTML=variant==='C'?timelineC(shown):tableHTML(shown);
  pageCount=pages;if(!pagerOpen)$('#pager').innerHTML=all.length?`<div class="pager"><button data-page="${page-1}" ${page<=1?'disabled':''}>Poprzednia</button><span class="pjump"><button class="linkish" data-pjump aria-haspopup="listbox" aria-expanded="false">Strona ${page} z ${pages}</button></span><button data-page="${page+1}" ${page>=pages?'disabled':''}>Następna</button></div>`:'';
  if($('#detail'))$('#detail').innerHTML=detailHTML(runs.find(r=>r.id===selected));
  $('#chips').innerHTML=clearHTML();
  $('#msg').innerHTML=message?`<div class="msg" role="status">${esc(message)}</div>`:'';
  document.querySelector('#navSync').innerHTML='Synchronizacje'+(active()?'<span class="dot" title="Trwa synchronizacja"></span>':'');
  document.querySelector('#stateBox').innerHTML=`wariant ${variant} · wybrana ${selected||'—'}<br>filtry ${esc(JSON.stringify(F))}<br>zakres ${esc(JSON.stringify(scope))}<br>synchronizacji ${runs.length}, w toku ${active()}`}
function bindStatic(){
  document.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{F[el.dataset.f]=el.value;page=1;refresh()});
  document.querySelectorAll('details.ms').forEach(d=>d.ontoggle=()=>{if(d.open)return;
    const v=[...d.querySelectorAll('input:checked')].map(i=>i.value);const k=d.dataset.ms;
    if(JSON.stringify(v)!==JSON.stringify(F[k])){F[k]=v;page=1;render()}})}
document.addEventListener('mousedown',e=>{if(pagerOpen&&!e.target.closest('.pjump'))closePageJump()});
document.addEventListener('mousedown',e=>document.querySelectorAll('details.ms[open]').forEach(d=>{if(!d.contains(e.target))d.open=false}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details.ms[open]').forEach(d=>d.open=false)},true);
document.addEventListener('click',e=>{const t=e.target.closest('[data-run],[data-sync],[data-all],[data-newsync],[data-close],[data-rerun],[data-chip],[data-demo],[data-stale],[data-page],[data-pjump],[data-goto]');if(!t)return;
  if(t.dataset.sync!==undefined){e.stopPropagation();requestOne(t.dataset.sync)}
  else if(t.dataset.run!==undefined){e.stopPropagation();select(t.dataset.run)}
  else if(t.dataset.all!==undefined)openAllDialog();
  else if(t.dataset.newsync!==undefined)openAllDialog({title:'Nowa synchronizacja',preselect:'none'});
  else if(t.dataset.close!==undefined)select(null);
  else if(t.dataset.rerun){const r=runs.find(x=>x.id===t.dataset.rerun);const res=request(r.source,r.scope||scope);message=res.existing?`${src(r.source).name}: synchronizacja już trwa — nie zlecono drugiej.`:`Zlecono ponownie ${src(r.source).name}.`;select(res.run.id)}
  else if(t.dataset.chip){if(t.dataset.chip==='clear')F={source:[],status:[],trigger:'',period:'7'};page=1;render()}
  else if(t.dataset.pjump!==undefined){pagerOpen?closePageJump():openPageJump()}
  else if(t.dataset.goto){page=Number(t.dataset.goto);pagerOpen=false;refresh();scrollTo({top:document.querySelector('.toolbar').offsetTop-10})}
  else if(t.dataset.page){page=Number(t.dataset.page);refresh();scrollTo({top:document.querySelector('.toolbar').offsetTop-10})}
  else if(t.dataset.stale!==undefined){staleOpen=!staleOpen;refresh()}
  else if(t.dataset.demo)alert('W produkcie: '+t.dataset.demo)
});
document.addEventListener('input',e=>{if(e.target.dataset.scope&&!e.target.closest('dialog')){scope[e.target.dataset.scope]=e.target.value}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,[contenteditable]')||document.querySelector('#dlg').open)return;
  if(e.key==='ArrowLeft')changeVariant(-1);if(e.key==='ArrowRight')changeVariant(1);if(e.key==='Escape'&&selected)select(null)});
function changeVariant(d){const v=['A','C'];variant=v[(v.indexOf(variant)+d+2)%2];const u=new URL(location);u.searchParams.set('variant',variant);history.replaceState({},'',u);render()}
document.querySelector('#prev').onclick=()=>changeVariant(-1);document.querySelector('#next').onclick=()=>changeVariant(1);
render();

// State tooltip: positioned in JS so it stays 16px away from the window edges.
const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
function showTip(el){tip.textContent=el.dataset.tip;tip.style.display='block';const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight,M=16;
  let x=r.right-w;x=Math.max(M,Math.min(x,innerWidth-w-M));let y=r.bottom+8;if(y+h>innerHeight-M)y=r.top-h-8;tip.style.left=x+'px';tip.style.top=y+'px'}
const hideTip=()=>{tip.style.display='none'};
document.addEventListener('mouseover',e=>{const b=e.target.closest('[data-tip]');b?showTip(b):hideTip()});
document.addEventListener('focusin',e=>{const b=e.target.closest('[data-tip]');b?showTip(b):hideTip()});
document.addEventListener('scroll',hideTip,true);
</script>
</html>
