<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototyp • Oferty i firmy</title>
<style>
:root{font:14px/1.5 system-ui,sans-serif;color:#20312d;background:#f4f6f3;--green:#245e49;--muted:#64716b;--line:#dbe2da}*{box-sizing:border-box}body{margin:0;padding-bottom:100px}button,input,select,textarea{font:inherit}button,a,select{cursor:pointer}button{border:1px solid var(--line);background:white;padding:7px 12px;border-radius:6px;color:inherit}button:hover{border-color:var(--green);background:#eef5ef}button.active,.primary{background:var(--green);color:white;border-color:var(--green)}a{color:var(--green)}header{padding:15px 28px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;flex-wrap:wrap}header strong{font-size:19px}header small{margin-left:auto;color:var(--muted)}.notice{background:#fff4d9;padding:8px 28px;font-size:12px}.shell{max-width:1600px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:start;gap:20px}h1{font-size:27px;letter-spacing:-.6px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:17px 0 8px}p{margin:8px 0 14px}.muted,small{color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}input,select,textarea{border:1px solid var(--line);border-radius:6px;background:white;padding:8px}input{min-width:230px}textarea{width:100%;min-height:75px}.tag{display:inline-block;border:1px solid var(--line);padding:2px 7px;border-radius:5px;font-size:12px;margin:2px;background:#f8faf7}.warn{background:#fff3d6;color:#885b00;border-color:#e8d496}.ok{background:#e9f4eb;color:#235b3b}.bad{background:#f9e9e6;color:#963d2e}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:22px}.split{display:grid;grid-template-columns:minmax(550px,1.5fr) minmax(360px,1fr);gap:20px;align-items:start}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;background:#fff}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:500}tr.selected{background:#edf5ef}tbody tr{cursor:pointer}tbody tr:hover{background:#f4f8f3}.score{font-size:22px;font-weight:700;color:var(--green)}.score small{font-size:12px;font-weight:400}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.section{border-top:1px solid var(--line);padding-top:15px;margin-top:17px}.bars>div{display:grid;grid-template-columns:110px 1fr 42px;gap:12px;align-items:center;margin:8px 0}.bar{height:6px;background:#e8ede5;border-radius:8px}.bar i{display:block;height:100%;background:#5f8c70;border-radius:8px}.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:15px;overflow-x:auto;margin-bottom:24px}.column{background:#e9eee7;border-radius:9px;padding:14px;min-height:240px}.card{padding:16px;background:white;border:1px solid var(--line);border-radius:8px;margin:10px 0;cursor:pointer}.card.selected{border:2px solid var(--green)}.companylayout{display:grid;grid-template-columns:260px minmax(420px,1fr) minmax(350px,.9fr);gap:20px;align-items:start}.companybutton{display:block;text-align:left;width:100%;margin-bottom:10px;padding:16px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{background:#f5f7f3;padding:10px;border-radius:6px}.fact small{display:block}.history{padding-left:18px;font-size:13px}.history li{padding:4px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c3029;color:white;border-radius:40px;box-shadow:0 6px 30px #0003;display:flex;gap:16px;align-items:center;padding:9px 13px;z-index:5;white-space:nowrap}.switcher button{background:#314c40;color:white;border:0;border-radius:50%}.state{margin-top:25px;font:12px/1.5 ui-monospace,monospace;background:#e8eee6;padding:14px;white-space:pre-wrap;border-radius:8px}dialog{max-width:680px;width:90%;border:1px solid var(--line);border-radius:12px;padding:26px}dialog::backdrop{background:#162e2580}.empty{padding:30px;color:var(--muted)}.tabs{display:flex;gap:7px;margin:15px 0}.linkbutton{padding:0;border:0;background:none;color:var(--green);text-align:left}.source{font-size:12px;color:var(--muted)}@media(max-width:1100px){.split,.companylayout{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,260px)}header small{margin-left:0}.shell{padding:16px}} 
</style>
<header><strong>Oferty pracy</strong><nav><button id="offersNav">Oferty</button> <button id="firmsNav">Firmy</button></nav><small>Ostatnie pełne pobranie: dziś, 08:10 · AI: 31 / 100 zł · rezerwacje: 4 zł</small></header>
<div class="notice">PROTOTYP DO OCENY · fikcyjne firmy, oferty, źródła i oceny · zmiany tylko w pamięci, odświeżenie resetuje dane</div>
<main class="shell" id="app"></main><div class="switcher" id="switcher"><button id="prev" aria-label="Poprzedni wariant">←</button><span id="variantLabel"></span><button id="next" aria-label="Następny wariant">→</button></div><dialog id="modal"></dialog>
<script>
// Throwaway UI: three structural variants on /index.html?variant=A|B|C. No product code or persistence.
const companies=[{id:1,name:'Northstar Labs',kind:'Pracodawca bezpośredni',about:'Fikcyjna firma produktowa rozwijająca platformę logistyczną.',tech:['TypeScript','Vue','PostgreSQL','Kubernetes'],basic:'Gotowy · 27.10.2026',deep:'Jeszcze nie uruchomiony'},{id:2,name:'Bridge Talent',kind:'Agencja · klient nieujawniony',about:'Fikcyjna agencja rekrutacyjna. Technologii projektu nie przypisujemy automatycznie agencji.',tech:[],basic:'Gotowy · 29.10.2026',deep:'Jeszcze nie uruchomiony'},{id:3,name:'Orbit Finance',kind:'Pracodawca bezpośredni',about:'Fikcyjny dostawca narzędzi do raportowania finansowego.',tech:['React','Java','AWS'],basic:'Brak · oferta nie spełnia progu',deep:'Jeszcze nie uruchomiony'}];
const offers=[{id:1,c:1,title:'Senior Frontend Developer',pay:'24–29 tys. PLN',basis:'B2B · netto / miesiąc',place:'Zdalnie z Polski',tech:['TypeScript','Vue','Nuxt'],rating:87,complete:92,stage:'Do przejrzenia',decision:'Brak decyzji',note:'',source:'SOLID.Jobs · 2 ogłoszenia połączone ręcznie',unknown:'Nieznana częstotliwość dyżurów',parts:[92,85,80,90]}, {id:2,c:2,title:'Fullstack TypeScript Developer',pay:'Widełki nieznane',basis:'B2B · pełny etat',place:'Zdalnie · dostępność z Polski niepotwierdzona',tech:['TypeScript','Node.js','React'],rating:81,complete:56,stage:'Do przejrzenia',decision:'Brak decyzji',note:'',source:'SOLID.Jobs · 1 ogłoszenie',unknown:'Nieznane: klient, widełki, dostępność z Polski',parts:[88,85,null,70]}, {id:3,c:1,title:'Frontend Platform Engineer',pay:'26–32 tys. PLN',basis:'B2B · netto / miesiąc',place:'Warszawa · hybryda 2 dni / tydz.',tech:['TypeScript','Vue','Vite'],rating:90,complete:96,stage:'Rozmowa',decision:'Zainteresowany',note:'Zapytaj o migrację na Vue 3.',source:'SOLID.Jobs · 1 ogłoszenie',unknown:'Oferta zmieniona: rating wymaga odświeżenia',parts:[96,90,80,94]}, {id:4,c:3,title:'Senior React Developer',pay:'18–23 tys. PLN',basis:'UoP · brutto / miesiąc',place:'Kraków · stacjonarnie',tech:['React','TypeScript'],rating:52,complete:88,stage:'Archiwum',decision:'Odrzucona',note:'',source:'SOLID.Jobs · ogłoszenie wygasłe',unknown:'Potwierdzona niezgodność: praca stacjonarna',parts:[65,80,10,45]}, {id:5,c:1,title:'Frontend Engineer — Design Systems',pay:'22–27 tys. PLN',basis:'B2B · netto / miesiąc',place:'Zdalnie z Polski',tech:['TypeScript','Vue','Storybook'],rating:84,complete:85,stage:'Do przejrzenia',decision:'Brak decyzji',note:'',source:'SOLID.Jobs · 1 ogłoszenie',unknown:'Możliwy duplikat oferty Senior Frontend Developer',parts:[90,75,85,85]}];
const names={A:'Tabela + panel oferty',B:'Tablica rekrutacji',C:'Firmy + kontekst technologii'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
let view='offers',selected=1,company=1,query='',filter='all',sort='rating',events=[];
const byId=id=>offers.find(o=>o.id===Number(id)),firm=id=>companies.find(c=>c.id===Number(id));
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tags=xs=>xs.map(x=>`<span class="tag">${esc(x)}</span>`).join('');
function list(){return offers.filter(o=>(`${o.title} ${firm(o.c).name} ${o.tech.join(' ')}`.toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||filter==='unknown'&&o.complete<80||filter==='active'&&o.stage!=='Archiwum'||filter==='interest'&&o.decision==='Zainteresowany')).sort((a,b)=>sort==='rating'?b.rating-a.rating:sort==='complete'?b.complete-a.complete:a.title.localeCompare(b.title));}
function toolbar(){return `<div class="toolbar"><input id="search" aria-label="Szukaj ofert" placeholder="Stanowisko, firma, technologia" value="${esc(query)}"><select id="filter" aria-label="Filtr ofert"><option value="all">Wszystkie pobrane oferty</option><option value="active">Poza archiwum</option><option value="unknown">Z istotnymi brakami danych</option><option value="interest">Zainteresowany</option></select><select id="sort" aria-label="Sortowanie"><option value="rating">Rating malejąco</option><option value="complete">Kompletność malejąco</option><option value="title">Stanowisko A–Z</option></select><span class="tag">${list().length} ofert · pełne filtry w docelowej aplikacji</span></div>`;}
function table(xs){return `<div class="tablewrap"><table><thead><tr><th>Oferta / firma</th><th>Warunki</th><th>Ocena AI</th><th>Moja decyzja</th></tr></thead><tbody>${xs.map(o=>`<tr tabindex="0" role="button" data-offer="${o.id}" class="${o.id===selected?'selected':''}"><td><b>${o.title}</b><br><small>${firm(o.c).name}</small><div>${tags(o.tech)}</div></td><td>${o.pay}<br><small>${o.basis}<br>${o.place}</small></td><td><span class="score">${o.rating}</span><br><small>Kompletność ${o.complete}%</small>${o.id===3?'<br><span class="tag warn">Nieaktualna</span>':''}</td><td>${o.decision}<br><small>${o.stage}</small></td></tr>`).join('')}</tbody></table>${xs.length?'':'<div class="empty">Brak ofert spełniających filtry.</div>'}</div>`;}
function detail(o){return `<article class="panel"><div class="row"><small>OFERTA #${o.id}</small><button data-company="${o.c}">Profil firmy ↗</button></div><h2>${o.title}</h2><p><a href="#" data-company="${o.c}">${firm(o.c).name}</a> · ${firm(o.c).kind}</p><div class="facts"><div class="fact">${o.pay}<small>${o.basis}</small></div><div class="fact">${o.place}<small>Senior · pełny etat</small></div></div><p>${tags(o.tech)}</p><p><span class="tag warn">${o.unknown}</span></p><p class="source">${o.source} · pobrano dziś 08:10<br>Link do oryginału: niedostępny w fikcyjnych danych</p><section class="section"><div class="row"><h2>Dopasowanie</h2><span class="score">${o.rating}<small> / 100</small></span></div><p>Kompletność danych: <b>${o.complete}%</b> · ${o.id===3?'Ocena poprzedniej wersji oferty':'Ocena aktualnej wersji oferty'}</p><div class="bars">${['Technologie','Doświadczenie','Warunki','Kierunek rozwoju'].map((x,i)=>`<div><span>${x}</span><span class="bar"><i style="width:${o.parts[i]||0}%"></i></span><b>${o.parts[i]??'?'}</b></div>`).join('')}</div><p><b>Mocne strony:</b> doświadczenie TypeScript zgodne z profilem.<br><b>Luki / niewiadome:</b> ${o.unknown.toLowerCase()}. Brak danych nie oznacza niedopasowania.</p><details><summary>Uzasadnienie i dowody składowych</summary><p>Technologie: oferta wymaga TypeScript, profil deklaruje 5 lat pracy z TypeScript. Doświadczenie: poziom senior zgodny z profilem. Warunki: ${o.parts[2]===null?'brak wystarczających danych; składowa wyłączona z ratingu':'porównanie deklarowanych warunków z preferencjami'}. Kierunek rozwoju: praca frontend zgodna z deklarowanym kierunkiem.</p><small>Przykładowe dane · profil v3 · treść oferty v2 · wagi 40/25/20/15. Liczby służą ocenie interfejsu.</small></details><div class="actions"><button data-action="rerate" data-id="${o.id}">Oceń ponownie</button><button data-action="manual" data-id="${o.id}">Wpisz własną ocenę</button></div><small>Ponowna ocena AI może zastąpić ręczną ocenę; poprzednia pozostaje w historii.</small></section><section class="section"><h2>Moja decyzja i rekrutacja</h2><div class="actions"><select id="decision" aria-label="Moja decyzja">${['Brak decyzji','Zainteresowany','Odrzucona','Na później'].map(x=>`<option ${o.decision===x?'selected':''}>${x}</option>`).join('')}</select><select id="stage" aria-label="Etap rekrutacji">${['Do przejrzenia','Aplikacja wysłana','Rozmowa','Archiwum'].map(x=>`<option ${o.stage===x?'selected':''}>${x}</option>`).join('')}</select></div>${o.stage==='Rozmowa'?'<p class="tag ok">Rozmowa techniczna · 04.11, 10:00 · zadanie: przygotować pytania</p>':''}<label>Moja notatka<textarea id="note">${esc(o.note)}</textarea></label><button data-action="save" data-id="${o.id}">Zapisz w prototypie</button></section><section class="section"><h2>Research i przygotowanie</h2><p>Research firmy: <b>${firm(o.c).basic}</b>. Wynik wspólny dla ofert tej firmy.</p><div class="actions"><button data-company="${o.c}">Otwórz research firmy</button><button data-action="prep" data-id="${o.id}">Przygotowanie do tej oferty</button></div></section><section class="section"><details><summary>Aktualna treść ogłoszenia</summary><p>Szukamy osoby do rozwoju interfejsów produktu. Wymagania: ${o.tech.join(', ')}. Udział w przeglądach kodu, planowaniu i współpracy z zespołem produktowym.</p><small>Tekst demonstracyjny</small></details><details><summary>Historia zmian i ocen</summary><ul class="history">${events.filter(e=>e.id===o.id).map(e=>`<li>Dzisiaj · ${esc(e.text)}</li>`).join('')}<li>Dziś 08:10 · pobrano aktualną treść</li>${o.id===1?'<li>29.10 · ręcznie połączono dwa ogłoszenia w jedną ofertę</li>':''}<li>28.10 · AI: ${o.rating}/100, kompletność ${o.complete}%</li></ul></details>${o.id===5?'<p class="tag warn">Podobna oferta: Senior Frontend Developer</p><button data-action="merge" data-id="5">Przejrzyj możliwość połączenia</button>':''}</section></article>`;}
function companyDetail(c){return `<section class="panel"><small>PROFIL FIRMY</small><h2>${c.name}</h2><p>${c.kind}</p><p>${c.about}</p><h3>Technologie firmy</h3>${c.tech.length?tags(c.tech):'<p class="muted">Brak potwierdzonych technologii agencji.</p>'}<p class="source">Dowody demonstracyjne: strona zespołu · odczyt 27.10.2026. W produkcie: odnośniki do materiałów.</p><section class="section"><h3>Research podstawowy</h3><p>${c.basic}</p><p>Produkt, skala zespołu, model pracy i źródła. Wyniki pozostają dostępne bez automatycznego odświeżania.</p><button data-action="basic" data-id="${c.id}">${c.basic.startsWith('Brak')?'Uruchom':'Odśwież na żądanie'}</button><h3>Research pogłębiony</h3><p>${c.deep}</p><button class="primary" data-action="deep" data-id="${c.id}">Uruchom pogłębiony research</button><small style="display:block;margin-top:8px">Koszt płatnych operacji wymaga dostępnego budżetu.</small></section><section class="section"><h3>Technologie według oferty / projektu</h3>${offers.filter(o=>o.c===c.id).map(o=>`<div style="margin:14px 0"><button class="linkbutton" data-offer="${o.id}">${o.title} ↗</button><br>${tags(o.tech)}${c.id===2?'<small> · projekt klienta o nieznanej tożsamości</small>':''}</div>`).join('')}</section><details class="section"><summary>Historia researchu i moje informacje</summary><p>Wersja 1 · ${c.basic}. Informacje od rekrutera można dopisać jak zwykłą notatkę ze źródłem.</p></details></section>`;}
function VariantA(){return `<div class="split"><section class="panel" style="padding:8px">${table(list())}</section>${detail(byId(selected))}</div>`;}
function VariantB(){const stages=['Do przejrzenia','Aplikacja wysłana','Rozmowa','Archiwum'];return `<div class="board">${stages.map(s=>`<section class="column"><b>${s}</b><small> · ${list().filter(o=>o.stage===s).length}</small>${list().filter(o=>o.stage===s).map(o=>`<article tabindex="0" role="button" class="card ${selected===o.id?'selected':''}" data-offer="${o.id}"><small>${firm(o.c).name}</small><h3>${o.title}</h3><div class="row"><span class="score">${o.rating}</span><small>${o.complete}% danych</small></div><p>${o.pay}</p><span class="tag">${o.decision}</span>${o.complete<80?'<span class="tag warn">Braki danych</span>':''}</article>`).join('')}</section>`).join('')}</div><div class="split">${detail(byId(selected))}${companyDetail(firm(byId(selected).c))}</div>`;}
function VariantC(){return `<div class="companylayout"><aside>${companies.map(c=>`<button class="companybutton ${company===c.id?'active':''}" data-company-select="${c.id}"><b>${c.name}</b><br><small>${offers.filter(o=>o.c===c.id).length} ofert · ${c.kind}</small></button>`).join('')}</aside>${companyDetail(firm(company))}<section><h2>Oferty firmy</h2>${list().filter(o=>o.c===company).map(o=>`<article class="card ${selected===o.id?'selected':''}" data-offer="${o.id}" tabindex="0" role="button"><b>${o.title}</b><p>${o.pay} · rating ${o.rating} · kompletność ${o.complete}%</p>${tags(o.tech)}</article>`).join('')||'<p>Brak ofert przy obecnych filtrach.</p>'}${detail(byId(selected))}</section></div>`;}
function render(){document.querySelector('#app').innerHTML=`<div class="top"><div><h1>${view==='firms'?'Firmy i ich oferty':variant==='B'?'Moje rekrutacje':'Wszystkie oferty'}</h1><p class="muted">${view==='firms'?'Research pracodawcy i technologie w kontekście projektu':'Ocena AI, kompletność danych i Twoja decyzja obok siebie'}</p></div><button data-action="fetch">Pobierz oferty teraz</button></div>${toolbar()}${view==='firms'?VariantC():variant==='A'?VariantA():variant==='B'?VariantB():VariantC()}<details class="state"><summary>Stan prototypu — zobacz po wykonaniu akcji</summary>${esc(JSON.stringify({variant,view,selectedOffer:selected,company,filter,sort,query,offers:offers.map(o=>({id:o.id,stage:o.stage,decision:o.decision,rating:o.rating,note:o.note})),research:companies.map(c=>({id:c.id,basic:c.basic,deep:c.deep})),events},null,2))}</details>`;document.querySelector('#variantLabel').textContent=`${variant} · ${names[variant]}`;document.querySelector('#filter').value=filter;document.querySelector('#sort').value=sort;document.querySelector('#offersNav').classList.toggle('active',view==='offers');document.querySelector('#firmsNav').classList.toggle('active',view==='firms');bind();}
function changeVariant(d){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+d+3)%3];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState({},'',url);render();}
function dialog(title,body){const m=document.querySelector('#modal');m.innerHTML=`<h2>${title}</h2>${body}<div class="actions"><button id="closeModal">Zamknij</button></div>`;m.showModal();m.querySelector('#closeModal').onclick=()=>m.close();}
function action(a,id){const o=byId(id);if(a==='save'){const old=o.stage;o.decision=document.querySelector('#decision').value;o.stage=document.querySelector('#stage').value;o.note=document.querySelector('#note').value;events.unshift({id:o.id,text:`Zapisano decyzję: ${o.decision}; etap: ${old} → ${o.stage}; notatkę.`});render();}else if(a==='manual'){dialog('Ręczna ocena',`<p>Poprzednia ocena ${o.rating} zostanie w historii. AI może później zastąpić tę ocenę.</p><input id="manualScore" type="number" min="0" max="100" value="${o.rating}" aria-label="Nowa ocena"><button id="applyScore">Zapisz ocenę</button>`);document.querySelector('#applyScore').onclick=()=>{const v=Number(document.querySelector('#manualScore').value);if(v<0||v>100)return;events.unshift({id:o.id,text:`Ręczna zmiana oceny: ${o.rating} → ${v}`});o.rating=v;document.querySelector('#modal').close();render();};}else if(a==='rerate'||a==='basic'||a==='deep'){const c=firm(id);dialog('Symulacja operacji AI',`<p>${a==='rerate'?'Ponowna ocena aktualnego profilu i oferty. Poprzedni wynik pozostanie w historii.':a==='basic'?'Nowa wersja researchu podstawowego firmy; dotychczasowa pozostanie w historii.':'Research pogłębiony firmy oraz technologie, projekty i sposoby pracy.'}</p><p>W produkcie: rezerwacja kosztu przed wywołaniem, podgląd stanu i możliwość ponowienia po błędzie.</p><button id="simulate">Symuluj zakończenie</button>`);document.querySelector('#simulate').onclick=()=>{if(a==='rerate'){events.unshift({id:o.id,text:`Ponowna ocena AI: poprzednio ${o.rating}, nowy wynik demonstracyjny 86`});o.rating=86;}else{c[a==='basic'?'basic':'deep']='Gotowy · symulacja dzisiaj';events.unshift({id:0,text:`${c.name}: ${a==='basic'?'podstawowy':'pogłębiony'} research zakończony (symulacja)`});}document.querySelector('#modal').close();render();};}else if(a==='prep'){dialog('Przygotowanie do rozmowy',`<p><b>${o.title} · ${firm(o.c).name}</b></p><h3>Co powtórzyć</h3><p>${o.tech.join(', ')}: architektura aplikacji, testowanie i wydajność. Przećwicz omówienie decyzji z ostatniego projektu.</p><h3>O co zapytać</h3><p>Kto podejmuje decyzje techniczne? Jak wyglądają wdrożenia i review? ${o.unknown}.</p><small>Przykładowa synteza, nie ustalenia o prawdziwej firmie. W aplikacji oddzielimy potwierdzone informacje, hipotezy i zalecenia.</small>`);}else if(a==='merge'){dialog('Możliwe połączenie ofert','<p>Frontend Engineer — Design Systems i Senior Frontend Developer mają wspólną firmę i część technologii. To za mało, by automatycznie uznać jedną rekrutację.</p><p>W docelowym ekranie: porównanie ogłoszeń, wybór oferty głównej, rozbieżności oraz odwracalne połączenie z wpisem w historii.</p><p>Prototyp nie rozstrzyga tożsamości tych ofert.</p>');}else if(a==='fetch'){dialog('Pobranie ofert','<p>Przykład stanu: pobieranie stron 2/4. Po pełnym przebiegu aktualizujemy dostępność źródłowych ogłoszeń.</p><p>Przy błędzie: zachowane pobrane dane, stan niepełny i możliwość ponowienia. Brak oferty w niepełnym przebiegu nie oznacza wygaśnięcia.</p>');}}
function bind(){document.querySelectorAll('[data-offer]').forEach(el=>{el.onclick=()=>{selected=Number(el.dataset.offer);company=byId(selected).c;render();};el.onkeydown=e=>{if(e.key==='Enter')el.click();};});document.querySelectorAll('[data-company]').forEach(el=>el.onclick=e=>{e.preventDefault();company=Number(el.dataset.company);view='firms';selected=offers.find(o=>o.c===company).id;render();});document.querySelectorAll('[data-company-select]').forEach(el=>el.onclick=()=>{company=Number(el.dataset.companySelect);selected=offers.find(o=>o.c===company).id;render();});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action,Number(el.dataset.id)));document.querySelector('#search').oninput=e=>{const pos=e.target.selectionStart;query=e.target.value;render();const input=document.querySelector('#search');input.focus();input.setSelectionRange(pos,pos);};document.querySelector('#filter').onchange=e=>{filter=e.target.value;render();};document.querySelector('#sort').onchange=e=>{sort=e.target.value;render();};}
document.querySelector('#prev').onclick=()=>changeVariant(-1);document.querySelector('#next').onclick=()=>changeVariant(1);document.querySelector('#offersNav').onclick=()=>{view='offers';render();};document.querySelector('#firmsNav').onclick=()=>{view='firms';render();};document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||document.querySelector('#modal').open)return;if(e.key==='ArrowLeft')changeVariant(-1);if(e.key==='ArrowRight')changeVariant(1);});render();
</script></html>
